<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ExamPrep">
<meta name="application-name" content="ExamPrep">
<meta name="theme-color" content="#062A78">
<meta name="description" content="Prepare for WAEC and JAMB with personalised practice, lessons, and exam simulations. Works offline.">
<meta name="format-detection" content="telephone=no">
<title>ExamPrep — WAEC &amp; JAMB Prep</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<!-- Apple Touch Icons -->
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192x192.png">

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-96x96.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon-72x72.png">

<!-- Apple splash screens (portrait) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#0a0c14;min-height:100vh;overflow-x:hidden;overflow-y:hidden}

/* ── Shell ── */
#app-shell{width:100vw;min-height:100vh;display:flex;flex-direction:column;align-items:center;background:#0a0c14}
.logo-mark{width:26px;height:26px;background:#062A78;border-radius:7px;box-shadow:0 3px 0 #020c20;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.logo-a1{position:absolute;top:-5px;right:-6px;background:#FFB800;border-radius:3px;font-size:6px;font-weight:900;color:#062A78;padding:1px 3px;line-height:1.4}
#root{width:100%;display:flex;justify-content:center;flex:1}

/* ── Light / Dark token variables ── */
:root{
  --bg:#0a0c14; --bg2:rgba(255,255,255,.03); --bg3:rgba(255,255,255,.06);
  --card:rgba(255,255,255,.04); --card2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
  --prim:#ffffff; --sec:rgba(255,255,255,.7); --tert:rgba(255,255,255,.35);
  --inset:rgba(255,255,255,.06);
  --xp-track:rgba(255,255,255,.08);
  --star-col:#fff;
  --shadow:0 2px 0 rgba(0,0,0,.6);
  --coach-bg:rgba(18,100,229,.1); --coach-bd:rgba(18,100,229,.25);
  --quest-bg:linear-gradient(145deg,#071B49 0%,#0c2460 50%,#062A78 100%);
  --quest-bd:rgba(24,183,242,.2);
  --week-done:rgba(24,183,242,.15); --week-done-bd:rgba(24,183,242,.3);
  --week-today:#1264E5; --week-today-bd:#1264E5;
  --week-empty:rgba(255,255,255,.04); --week-empty-bd:rgba(255,255,255,.08);
  --subj-card:rgba(255,255,255,.03); --subj-bd:rgba(255,255,255,.07);
  --settings-bg:rgba(255,255,255,.03);
  --nav-bg:rgba(6,10,20,.95); --nav-bd:rgba(255,255,255,.07);
  --profile-hero:linear-gradient(155deg,#050b1a 0%,#062A78 45%,#1a1060 100%);
  --profile-hero-bd:rgba(24,183,242,.15);
  --stat-div:rgba(255,255,255,.07);
  --sidebar-bg:rgba(255,255,255,.03); --sidebar-bd:rgba(255,255,255,.07);
  --desk-header-bg:rgba(6,10,20,.95); --desk-header-bd:rgba(255,255,255,.07);
  --right-card:rgba(255,255,255,.03);
}
.light{
  --bg:#f0f4ff; --bg2:#ffffff; --bg3:#e8eeff;
  --card:#ffffff; --card2:#f5f7ff;
  --border:#dde4f5; --border2:#c4cfed;
  --prim:#071B49; --sec:#3a4870; --tert:#7a8aaa;
  --inset:#e4eaf8;
  --xp-track:#dde4f5;
  --star-col:#062A78;
  --shadow:0 2px 0 rgba(10,30,80,.15);
  --coach-bg:rgba(18,100,229,.06); --coach-bd:rgba(18,100,229,.18);
  --quest-bg:linear-gradient(145deg,#062A78 0%,#0c3a94 50%,#1264E5 100%);
  --quest-bd:rgba(24,183,242,.3);
  --week-done:rgba(18,100,229,.1); --week-done-bd:rgba(18,100,229,.25);
  --week-today:#1264E5; --week-today-bd:#1264E5;
  --week-empty:#f0f4ff; --week-empty-bd:#dde4f5;
  --subj-card:#ffffff; --subj-bd:#dde4f5;
  --settings-bg:#ffffff;
  --nav-bg:rgba(248,251,255,.97); --nav-bd:#dde4f5;
  --profile-hero:linear-gradient(155deg,#062A78 0%,#1264E5 55%,#18B7F2 100%);
  --profile-hero-bd:rgba(18,100,229,.3);
  --stat-div:rgba(255,255,255,.18);
  --sidebar-bg:#ffffff; --sidebar-bd:#dde4f5;
  --desk-header-bg:rgba(248,251,255,.97); --desk-header-bd:#dde4f5;
  --right-card:#ffffff;
}

/* ── Phone ── */
.phone{width:100%;min-height:100vh;border-radius:0;overflow:hidden;position:relative;display:flex;flex-direction:column;flex-shrink:0}
.phone.light{}
.phone-notch{display:none}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;padding-bottom:84px}
.scroll::-webkit-scrollbar{display:none}

/* ── Bottom nav ── */
.bnav{position:absolute;bottom:0;left:0;right:0;height:70px;display:flex;align-items:center;padding:0 6px 10px;z-index:20;background:var(--nav-bg);border-top:1px solid var(--nav-bd);backdrop-filter:blur(20px)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 0;cursor:pointer;border:none;background:none;transition:all .18s;position:relative;color:var(--tert)}
.bni-label{font-size:9px;font-weight:700;letter-spacing:.01em;color:var(--tert)}
.bni.on .bni-label,.bni.on{color:var(--accent-col,#18B7F2)}
.bni-dot{position:absolute;top:4px;width:16px;height:2.5px;border-radius:2px;opacity:0;transition:all .2s;background:var(--accent-col,#18B7F2)}
.bni.on .bni-dot{opacity:1}
.bni.on .bni-icon{transform:translateY(-1px) scale(1.06)}
.bni-icon{transition:transform .18s}

/* ── Desktop ── */
.desktop{width:100%;min-height:100vh;border-radius:0;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg)}
.light .desktop{}
.desk-header{height:52px;display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0;background:var(--desk-header-bg);border-bottom:1px solid var(--desk-header-bd);backdrop-filter:blur(20px);position:relative;z-index:10}
.desk-body{flex:1;display:flex;overflow:hidden;min-height:608px}
.desk-sidebar{width:220px;flex-shrink:0;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:2px;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-bd)}
.desk-sidebar::-webkit-scrollbar{display:none}
.desk-content{flex:1;overflow-y:auto;padding:20px 20px;display:flex;gap:16px;align-items:flex-start}
.desk-content::-webkit-scrollbar{display:none}
.desk-main{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.desk-aside{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:10px}

/* ── Sidebar nav link ── */
.snl{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;cursor:pointer;text-decoration:none;transition:all .15s;border:1.5px solid transparent;color:var(--tert);background:transparent;font-family:inherit;text-align:left;width:100%}
.snl.on{border-color:rgba(24,183,242,.25);background:rgba(24,183,242,.1);color:#18B7F2}
.light .snl.on{border-color:rgba(18,100,229,.2);background:rgba(18,100,229,.07);color:#1264E5}

/* ── Shared atoms ── */
.press-btn{border:none;cursor:pointer;font-weight:900;font-size:14px;border-radius:14px;width:100%;padding:14px;color:#fff;letter-spacing:-.015em;transition:transform .1s,box-shadow .1s;font-family:inherit;position:relative;overflow:hidden}
.press-btn.primary{background:#1264E5;box-shadow:0 5px 0 #0a3fa0,0 8px 20px rgba(18,100,229,.3)}
.press-btn.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #0a3fa0}
.press-btn.gold{background:linear-gradient(135deg,#FFB800,#FF6A00);box-shadow:0 5px 0 #b85000,0 8px 20px rgba(255,106,0,.25)}
.press-btn.gold:active{transform:translateY(3px);box-shadow:0 2px 0 #b85000}
.press-btn.ghost{background:var(--bg2);box-shadow:none;border:1px solid var(--border2);color:var(--sec)}
.btn-shimmer{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.13) 50%,transparent 100%);background-size:200% 100%;animation:shimmer 2.5s infinite}

.xp-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:rgba(255,184,0,.12);border:1.5px solid rgba(255,184,0,.28);font-size:11px;font-weight:800;color:#FFB800}
.light .xp-pill{background:rgba(255,184,0,.1);border-color:rgba(255,140,0,.3);color:#d97706}
.streak-badge{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:rgba(255,106,0,.12);border:1.5px solid rgba(255,106,0,.28);font-size:11px;font-weight:800;color:#FF6A00}
.light .streak-badge{background:rgba(255,106,0,.08);border-color:rgba(255,106,0,.22);color:#c2410c}
.streak-flame{display:inline-block;animation:flame-flicker 1.8s ease-in-out infinite}

.section-label{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--tert);margin-bottom:8px;display:block}
.xp-bar-track{height:5px;border-radius:99px;background:var(--xp-track);overflow:hidden}
.xp-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#18B7F2,#1264E5);transition:width .8s cubic-bezier(.34,1.56,.64,1)}
.dark-card{background:var(--card);border:1px solid var(--border);border-radius:16px}
.quest-card{border-radius:20px;overflow:hidden;position:relative;cursor:pointer;transition:transform .15s}
.quest-card:active{transform:scale(.98)}

/* ── Stars ── */
.stars-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;border-radius:50%;background:var(--star-col)}

/* ── Animations ── */
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flame-flicker{0%,100%{transform:scaleY(1) skewX(0)}33%{transform:scaleY(1.06) skewX(-2deg)}66%{transform:scaleY(.97) skewX(1deg)}}
@keyframes star-twinkle{0%,100%{opacity:.1;transform:scale(1)}50%{opacity:.45;transform:scale(1.3)}}
@keyframes slide-up{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes bounce-in{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes glow-pulse{0%,100%{box-shadow:0 0 10px rgba(18,100,229,.2)}50%{box-shadow:0 0 24px rgba(18,100,229,.45)}}
@keyframes xp-pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.xp-pill.popping{animation:xp-pop .3s ease}

/* ── PWA Install Banner ── */
#pwa-install-bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;padding:12px 16px;background:linear-gradient(135deg,#062A78,#1264E5);border-top:1px solid rgba(24,183,242,.3);backdrop-filter:blur(20px);flex-direction:row;align-items:center;gap:10px;box-shadow:0 -4px 20px rgba(0,0,0,.4)}
#pwa-install-bar.show{display:flex}
#pwa-install-bar .pwa-icon{width:36px;height:36px;border-radius:10px;overflow:hidden;flex-shrink:0}
#pwa-install-bar .pwa-icon img{width:100%;height:100%}
#pwa-install-bar .pwa-text{flex:1;min-width:0}
#pwa-install-bar .pwa-title{font-size:12px;font-weight:800;color:#fff;line-height:1.2}
#pwa-install-bar .pwa-sub{font-size:10px;color:rgba(255,255,255,.55);margin-top:1px}
#pwa-install-bar .pwa-install-btn{padding:8px 16px;border-radius:9px;background:#FFB800;color:#062A78;font-size:11px;font-weight:900;border:none;cursor:pointer;white-space:nowrap;font-family:inherit;box-shadow:0 3px 0 #b85000;transition:transform .1s}
#pwa-install-bar .pwa-install-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b85000}
#pwa-install-bar .pwa-dismiss{padding:8px;border-radius:8px;background:transparent;color:rgba(255,255,255,.4);font-size:18px;border:none;cursor:pointer;line-height:1;flex-shrink:0}
/* Safe area support for phones with notches */
body{padding-bottom:env(safe-area-inset-bottom)}
.bnav{padding-bottom:calc(10px + env(safe-area-inset-bottom))}

</style>
</head>
<body>

<!-- PWA Install Banner -->
<div id="pwa-install-bar">
  <div class="pwa-icon"><img src="icons/icon-192x192.png" alt="ExamPrep"></div>
  <div class="pwa-text">
    <div class="pwa-title">Add ExamPrep to your home screen</div>
    <div class="pwa-sub">Study offline · Works without internet</div>
  </div>
  <button class="pwa-install-btn" onclick="triggerPWAInstall()">Install</button>
  <button class="pwa-dismiss" onclick="dismissInstallBar()" aria-label="Dismiss">✕</button>
</div>

<div id="app-shell">
<div id="root"></div>
</div>

<script>
let MODE = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
let VIEW = window.innerWidth >= 768 ? 'desktop' : 'mobile'
let CUR = 'home'

// Respect system dark mode changes
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', e => {
  MODE = e.matches ? 'light' : 'dark'
  applyCSSVars()
  render()
})
// Respond to window resize for desktop/mobile switch
window.addEventListener('resize', () => {
  const newView = window.innerWidth >= 768 ? 'desktop' : 'mobile'
  if (newView !== VIEW) { VIEW = newView; render() }
})

const SUBJECTS = [
  { name:'Physics',   icon:'⚡', color:'#18B7F2', pct:72 },
  { name:'Chemistry', icon:'⚗️', color:'#9b7ae0', pct:45 },
  { name:'Biology',   icon:'🧬', color:'#4ade80', pct:58 },
  { name:'Maths',     icon:'📐', color:'#FFB800', pct:31 },
]
const WEAK = [
  { name:'Waves & Sound',     subject:'Physics',   color:'#18B7F2', icon:'⚡', pct:28 },
  { name:'Organic Chemistry', subject:'Chemistry', color:'#9b7ae0', icon:'⚗️', pct:19 },
]

// ── Token helpers ─────────────────────────────────────────────────────────────
const T = {
  isLight: () => MODE === 'light',
  pct:  p => p>=70 ? (MODE==='light'?'#059669':'#4ade80') : p>=40 ? '#FFB800' : (MODE==='light'?'#dc2626':'#f87171'),
}

// ── Shared builders ───────────────────────────────────────────────────────────
function stars(n=16) {
  let s=''
  for(let i=0;i<n;i++){
    const x=Math.random()*100,y=Math.random()*100,sz=Math.random()*1.6+.5
    const delay=Math.random()*4,dur=2+Math.random()*3
    s+=`<div class="star" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;opacity:.12;animation:star-twinkle ${dur}s ${delay}s ease-in-out infinite"></div>`
  }
  return `<div class="stars-bg">${s}</div>`
}

function ring(pct,size=96,stroke=8,color='#1264E5',glow=false){
  const r=(size-stroke)/2,circ=2*Math.PI*r,dash=(pct/100)*circ
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="${glow?`filter:drop-shadow(0 0 8px ${color}88)`:''}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--xp-track)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-linecap="round" stroke-dasharray="${dash} ${circ}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`
}

function zaraMsg(msg) {
  return `<div style="padding:11px 13px;background:var(--coach-bg);border:1.5px solid var(--coach-bd);border-radius:14px;display:flex;gap:10px;align-items:flex-start">
    <div style="width:34px;height:34px;border-radius:10px;overflow:hidden;flex-shrink:0">
      <svg width="34" height="34" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="20" fill="#062A78"/><rect x="17" y="25" width="6" height="5" rx="2" fill="#C68642"/><path d="M9 36C9 31 13.5 28 20 28C26.5 28 31 31 31 36" fill="#1a3a8f"/><circle cx="20" cy="20" r="8.5" fill="#C68642"/><path d="M11.5 19C11.5 13.2 15.3 10 20 10C24.7 10 28.5 13.2 28.5 19" fill="#1a0a00"/><ellipse cx="17" cy="20" rx="1.4" ry="1.5" fill="#1a0a00"/><ellipse cx="23" cy="20" rx="1.4" ry="1.5" fill="#1a0a00"/><circle cx="17.5" cy="19.4" r=".5" fill="white"/><circle cx="23.5" cy="19.4" r=".5" fill="white"/><path d="M17 23.5C17 23.5 18.5 25 20 25C21.5 25 23 23.5 23 23.5" stroke="#7a3f00" stroke-width="1" stroke-linecap="round" fill="none"/></svg>
    </div>
    <div style="flex:1">
      <p style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#18B7F2;margin-bottom:2px">Zara · Study buddy</p>
      <p style="font-size:12px;font-weight:500;color:var(--sec);line-height:1.5">${msg}</p>
    </div>
  </div>`
}

function xpBar(pct){ return `<div class="xp-bar-track"><div class="xp-bar-fill" style="width:${pct}%"></div></div>` }

function subjCard(s,i,total){
  return `<div style="display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:${i<total-1?'1px solid var(--border)':'none'}">
    <div style="width:36px;height:36px;border-radius:10px;background:${s.color}18;border:1px solid ${s.color}22;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0">${s.icon}</div>
    <div style="flex:1;min-width:0">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:13px;font-weight:700;color:var(--prim)">${s.name}</span>
        <span style="font-size:12px;font-weight:900;color:${T.pct(s.pct)}">${s.pct}%</span>
      </div>
      ${xpBar(s.pct)}
    </div>
  </div>`
}

function questCard(compact=false){
  const days=['Mo','Tu','We','Th','Fr','Sa','Su']
  const dots = days.map((d,i)=>{
    const done=i<5,today=i===1
    let bg=`var(--week-empty)`,bd=`var(--week-empty-bd)`,col=`var(--tert)`,txt=d[0]
    if(today){bg=`var(--week-today)`;bd=`var(--week-today-bd)`;col='#fff';txt='●'}
    else if(done){bg=`var(--week-done)`;bd=`var(--week-done-bd)`;col='#18B7F2';txt='✓'}
    return `<div style="width:${compact?24:26}px;height:${compact?24:26}px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:${compact?8:9}px;font-weight:800;background:${bg};border:1px solid ${bd};color:${col}">${txt}</div>`
  }).join('')
  if(compact) return `<div style="border-radius:16px;overflow:hidden;cursor:pointer;background:var(--quest-bg);border:1px solid var(--quest-bd);padding:14px;animation:glow-pulse 3s ease-in-out infinite" onclick="go('practice')">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="position:relative;flex-shrink:0">${ring(0,60,6,'#1264E5',true)}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><p style="font-size:13px;font-weight:900;color:#fff;line-height:1">0</p><p style="font-size:7px;color:rgba(255,255,255,.4);font-weight:700">/5</p></div></div>
      <div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:3px"><p style="font-size:14px;font-weight:900;color:#fff">Quick 5</p><span style="font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px;background:rgba(255,184,0,.15);border:1px solid rgba(255,184,0,.25);color:#FFB800">+50 XP</span></div><p style="font-size:11px;color:rgba(255,255,255,.45)">Physics · Waves & Sound · ~4 min</p></div>
    </div>
    <div style="margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:4px;align-items:center">${dots}<div style="margin-left:auto;display:flex;align-items:center;gap:3px"><span class="streak-flame">🔥</span><span style="font-size:10px;font-weight:800;color:#FF6A00">5 days</span></div></div>
  </div>`

  return `<div class="quest-card" onclick="go('practice')" style="background:var(--quest-bg);border:1px solid var(--quest-bd);padding:18px;animation:glow-pulse 3s ease-in-out infinite">
    <div style="position:absolute;top:-20px;right:-20px;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(24,183,242,.18) 0%,transparent 70%);pointer-events:none"></div>

<script>
// ── Service Worker Registration ─────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        console.log('[ExamPrep] SW registered:', reg.scope);
        // Check for updates every time the app opens
        reg.update();
      })
      .catch(err => console.warn('[ExamPrep] SW registration failed:', err));
  });
}

// ── PWA Install Prompt ──────────────────────────────────────────────────────
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // Show the install bar unless user dismissed it before
  if (!localStorage.getItem('pwa-dismissed')) {
    document.getElementById('pwa-install-bar').classList.add('show');
  }
});

function triggerPWAInstall() {
  if (!deferredPrompt) {
    // Fallback: show instructions
    alert('To install ExamPrep:\n\nAndroid: tap the menu (⋮) → "Add to Home Screen"\niPhone: tap Share (□↑) → "Add to Home Screen"');
    return;
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(choice => {
    if (choice.outcome === 'accepted') {
      console.log('[ExamPrep] PWA installed');
      document.getElementById('pwa-install-bar').classList.remove('show');
    }
    deferredPrompt = null;
  });
}

function dismissInstallBar() {
  document.getElementById('pwa-install-bar').classList.remove('show');
  localStorage.setItem('pwa-dismissed', '1');
}

// Hide install bar once the app is installed
window.addEventListener('appinstalled', () => {
  document.getElementById('pwa-install-bar').classList.remove('show');
  deferredPrompt = null;
  console.log('[ExamPrep] App installed successfully');
});

// ── Offline / Online status indicator ──────────────────────────────────────
function updateOnlineStatus() {
  const offline = !navigator.onLine;
  let banner = document.getElementById('offline-banner');
  if (offline) {
    if (!banner) {
      banner = document.createElement('div');
      banner.id = 'offline-banner';
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;padding:6px 14px;background:#FF6A00;color:#fff;font-size:11px;font-weight:700;text-align:center;letter-spacing:.02em';
      banner.textContent = '📵 You are offline — studying from cached content';
      document.body.appendChild(banner);
    }
  } else {
    if (banner) banner.remove();
  }
}
window.addEventListener('online', updateOnlineStatus);
window.addEventListener('offline', updateOnlineStatus);
updateOnlineStatus();

// ── Handle deep-link hash on launch (shortcuts) ─────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const hash = location.hash.replace('#', '');
  const validScreens = ['home','practice','learn','leaderboard','results','progress','profile'];
  if (hash && validScreens.includes(hash)) {
    // Defer slightly to let the app render first
    setTimeout(() => { if (typeof go === 'function') go(hash); }, 100);
  }
});
</script>
